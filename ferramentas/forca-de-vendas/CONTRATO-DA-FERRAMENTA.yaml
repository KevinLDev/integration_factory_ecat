  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-004
  titulo_lacuna: Prevenção de loop bidirecional não documentada
  evidencia_conduta: Origem da alteração e mecanismo antirrealimentação exigem desenho posterior explícito.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-005
  titulo_lacuna: Nomenclatura divergente de campos
  evidencia_conduta: Preservar `cellphone/cellPhone`, `productSubcategoryErpId/subcategoryErpId`, `priceTablesErpId/priceTableErpId` e nomes de pedidos sem normalização silenciosa.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-006
  titulo_lacuna: Rotas com conflito entre path e parâmetro
  evidencia_conduta: Sete operações declaram `erpId` path sem placeholder. Não escolher formato da URL sem confirmação oficial.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-007
  titulo_lacuna: OpenAPI/Swagger bruto não disponível
  evidencia_conduta: O PDF é a fonte recebida; obter especificação bruta para validação estrutural mais forte.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-008
  titulo_lacuna: Política de conflito não documentada
  evidencia_conduta: Não definir sistema prevalente ou ordenação temporal sem decisão explícita.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-009
  titulo_lacuna: Reprocessamento seguro não documentado
  evidencia_conduta: Não definir repetição após falha parcial sem estratégia de consistência e deduplicação.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-010
  titulo_lacuna: Inconsistência entre status HTTP e mensagem
  evidencia_conduta: Preservar código e mensagem exatamente como publicados; não reclassificar por texto.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-011
  titulo_lacuna: Divergência nos campos de visibilidade de produto
  evidencia_conduta: '`isVisibleB2B/isVisibleForca` e `isVisible` não são equivalentes sem confirmação.'
  origem: Passo 01 corrigido e fonte oficial; ver referências
