  ordem_parcial:
  - '`companies`;'
  - '`brands`, `branches`, `genders`, `deadlines`, `payment-methods`, `price-tables`, `carriers`, `campaigns`, `lines`, `colors`, `representatives` e `sellers`;'
  - '`payment-conditions` depois de `payment-methods`;'
  - '`regions` depois de `price-tables`;'
  - '`categories` depois de `brands`, seguidas de `subcategories`;'
  - '`clients` depois de `representatives` quando `representativesErpIds` for usado;'
  - '`products` depois das dependências de catálogo;'
  - vínculo explícito `colors/products` depois de produto e cores;
  - '`products -> variants -> skus -> prices`, com `price-tables` também antes de `prices`;'
  - vínculos `representatives/clients` e `sellers/clients` depois das entidades envolvidas;
  - pedidos e seus registros de confirmação/status;
  - 'associação de imagens: ordem operacional pendente de `PEND-016`.'
  regra: Ordem parcial baseada somente nas referências publicadas; não garante atomicidade, idempotência ou rollback.
  diagnosticos_tratados:
  - DIAG-011
  - DIAG-013
pendencias:
- id: PEND-001
  titulo_lacuna: Aplicação, expiração, renovação e escopos do JWT não documentados
  evidencia_conduta: '`POST /auth` retorna JWT, mas header, prefixo, validade, refresh e escopos não são definidos. Não assumir `Bearer`.'
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-002
  titulo_lacuna: Rate limit, quota, timeout e retry/backoff não documentados
  evidencia_conduta: A fonte não publica limites ou política de repetição; definir somente após decisão/evidência externa autorizada.
  origem: Passo 01 corrigido e fonte oficial; ver referências
  detalhes: ferramentas/forca-de-vendas/PENDENCIAS.md
- id: PEND-003
  titulo_lacuna: Idempotência por módulo não documentada
