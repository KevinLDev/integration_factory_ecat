  descricao: Registro da materializacao real, em HML, do plano de instalacao aprovado no Passo 03
  etapa_origem: ERP_CLIENTE_PASSO_04
  versao: "1.0"
  observacoes:
    - Nao contem segredo
    - Representa apenas HML; producao nunca e destino desta etapa
    - Cada item deve referenciar o item correspondente do Passo 03 pelo mesmo capacidade_id
    - Nao reprojeta nem reclassifica nada do Passo 02/03
    - A execucao produtora nunca se autoaprova; AUDITORIA e STATUS_DA_ETAPA finais dependem de auditoria independente PROFUNDA

