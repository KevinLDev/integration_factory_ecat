    possui_customizacao_relevante: null # SIM | NAO | INDETERMINADO
    middleware_ou_api_customizada: null # NENHUM | MIDDLEWARE | API_CUSTOMIZADA | AMBOS | INDETERMINADO
    # ATENCAO: ver regras_de_classificacao antes de preencher status_capacidade.
    # ATIVO e PRONTO_PARA_ATIVACAO proibidos com qualquer suporte obrigatorio INDETERMINADO.
    # NAO_SUPORTADO exige evidencia negativa suficiente. Sem prova: PENDENTE_DE_EVIDENCIA.
    status_capacidade: null # ATIVO | PRONTO_PARA_ATIVACAO | NAO_SUPORTADO | PENDENTE_DE_EVIDENCIA
    decisao: null # ATIVAR | DEIXAR_PRONTO | CONFIGURACAO_CLIENTE | DE_PARA_CLIENTE | EXTENSAO_CLIENTE | GAP_DA_RELEASE | GAP_DA_FERRAMENTA | DIVERGENCIA_DE_EVIDENCIA | PENDENTE | NAO_APLICAVEL
    gap_identificado: null # NENHUM | GAP_DA_RELEASE | GAP_DA_FERRAMENTA | DIVERGENCIA_DE_EVIDENCIA
    rota_se_gap: null
    pendencia:
      status: null # NENHUMA | NAO_BLOQUEANTE | BLOQUEANTE
      descricao: null
      evidencia_faltante: []
    restricoes: []
