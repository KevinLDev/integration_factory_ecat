schema: fabrica.plano-homologacao-funcional.v1
metadata:
  modelo: TEMPLATE
  descricao: Plano funcional do Passo 08 para uma combinacao ERP x ferramenta
  versao: "1.0"
  etapa_origem: ERP_PARCEIRO_PASSO_08
  data_referencia: null
  observacoes:
    - Modelo V1 manual assistido por IA
    - Sem automacao de navegador e sem observer realtime
    - Nao contem segredos, credenciais ou dados pessoais desnecessarios
    - Nao representa uma execucao real por si so

regras_de_preenchimento:
  - Preencher apenas com suporte comprovado da combinacao vigente
  - Derivar cenarios do escopo real, sem checklist universal
  - Registrar referencias de baseline e artefatos upstream
  - Definir criterio de aprovacao por criticidade, nunca por percentual
  - Nao incluir acao automatica de UI na V1

valores_permitidos:
  criticidade:
    - CRITICO
    - ALTO
    - MEDIO
    - BAIXO
  status_cenario:
    - APROVADO
    - REPROVADO
    - BLOQUEADO
    - NAO_APLICAVEL
    - PENDENTE
    - PENDENTE_DE_EVIDENCIA
  executor:
    - HUMANO
  classificacao_falha:
    - BUG_DE_IMPLEMENTACAO
    - DIVERGENCIA_DE_PROJETO
    - BASE_DE_HOMOLOGACAO_INSUFICIENTE
    - CAPACIDADE_ERP_INCORRETA_OU_INSUFICIENTE
    - FALHA_TECNICA_HML
    - BUG_OU_DIVERGENCIA_DA_FERRAMENTA
    - FALHA_FUNCIONAL_DO_CENARIO

identificacao:
  execution_id: null
  jornada: ERP_PARCEIRO
  etapa: ERP_PARCEIRO_PASSO_08
  erp_slug: null
  ferramenta_slug: null
  combinacao_id: null
  data_planejamento: null
  responsavel: null

baseline:
  passo_07:
