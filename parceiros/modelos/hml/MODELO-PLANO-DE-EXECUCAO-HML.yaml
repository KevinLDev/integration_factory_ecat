schema: fabrica.plano-execucao-hml.v1
metadata:
  modelo: TEMPLATE
  descricao: Plano de execucao controlada do Passo 07 para uma combinacao ERP x ferramenta
  versao: "1.0"
  etapa_origem: ERP_PARCEIRO_PASSO_07
  data_referencia: null
  observacoes:
    - Nao representa uma execucao real
    - Nao contem credenciais, tokens, payloads sensiveis ou valores concretos de cliente
    - Reutiliza MANIFESTO-DA-ETAPA.yaml e CHECKPOINT-DA-EXECUCAO.yaml para controle de vigencia e retomada
    - Nao autoriza producao, homologacao funcional, publicacao ou runtime operacional

regras_de_preenchimento:
  - Preencher somente com fatos comprovados e flows definidos pelo Passo 05
  - Registrar somente gates upstream exigidos pela combinacao concreta
  - Identificar a implementacao por versao, hash e commit quando disponivel
  - Bloquear antes de escrita se ambiente, autorizacao, vigencia ou identidade nao puderem ser comprovados
  - Nao registrar segredo, payload sensivel desnecessario ou ID fisico como configuracao reutilizavel
  - Nao alterar mapeamento, transformacao, Base Mestra ou contrato neste plano

valores_permitidos:
  ambiente:
    - HML
    - HOMOLOGACAO
    - SANDBOX
    - TESTE
    - DEV_AUTORIZADO
  direcao:
    - ERP_PARA_FERRAMENTA
    - FERRAMENTA_PARA_ERP
    - BIDIRECIONAL_CONTROLADO
  modalidade:
    - CARGA_INICIAL
    - INCREMENTAL
    - REPROCESSAMENTO_CONTROLADO
  operacao:
    - READ
    - CREATE
    - UPDATE
    - UPSERT_COMPROVADO
    - DEACTIVATE
  politica_timeout_estado_incerto:
    - RECONSULTAR_ANTES_DE_RETRY
    - INTERROMPER_E_REGISTRAR
  politica_4xx:
    - SEM_RETRY_CEGO
  politica_valor_desconhecido:
    - BLOQUEAR_REGISTRO
    - USAR_FALLBACK_AUTORIZADO
    - PENDENTE_DE_MAPEAMENTO
  estado_precondicao:
    - ATENDIDA
    - NAO_ATENDIDA
    - PENDENTE_DE_EVIDENCIA
    - NAO_APLICAVEL

