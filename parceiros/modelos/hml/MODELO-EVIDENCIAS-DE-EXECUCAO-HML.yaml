schema: fabrica.evidencias-execucao-hml.v1
metadata:
  modelo: TEMPLATE
  descricao: Evidencias estruturadas e sanitizadas de uma execucao do Passo 07
  versao: "1.0"
  etapa_origem: ERP_PARCEIRO_PASSO_07
  data_referencia: null
  observacoes:
    - Nao contem segredo, token, header de autenticacao, payload pessoal desnecessario ou configuracao de cliente
    - O resultado HTTP isolado nao substitui reconsulta e comparacao semantica
    - Nao declara INTEGRACAO_HOMOLOGADA

regras_de_preenchimento:
  - Registrar uma evidencia por caso executado, inclusive caso repetido, loop ou reprocessamento
  - Sanitizar erros e respostas antes de persistir
  - Referenciar plano HML, versao da implementacao e manifesto da etapa
  - Registrar NAO_OBSERVAVEL quando a confirmacao nao puder ser provada, sem inferir sucesso
  - Registrar DIVERGENTE quando origem e destino nao forem semanticamente equivalentes conforme o Passo 05

valores_permitidos:
  status_caso:
    - CONFIRMADO
    - DIVERGENTE
    - NAO_OBSERVAVEL
    - PENDENTE_DE_EVIDENCIA
    - NAO_APLICAVEL
    - FALHOU_NA_EXECUCAO
  resultado_reconsulta:
    - CONFIRMADA
    - DIVERGENTE
    - NAO_OBSERVAVEL
    - FALHOU
    - NAO_APLICAVEL
  resultado_comparacao_semantica:
    - EQUIVALENTE
    - DIVERGENTE
    - PARCIAL_JUSTIFICADA
    - NAO_OBSERVAVEL
    - NAO_APLICAVEL
  classificacao_falha:
    - ERRO_DE_EXECUCAO_HML
    - BUG_DE_IMPLEMENTACAO
    - DIVERGENCIA_DE_PROJETO
    - BASE_DE_HOMOLOGACAO_INSUFICIENTE
    - EVIDENCIA_DE_ERP_INSUFICIENTE
    - CONTRATO_DA_FERRAMENTA_DIVERGENTE

