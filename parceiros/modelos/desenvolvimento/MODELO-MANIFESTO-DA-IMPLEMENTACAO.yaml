schema: fabrica.manifesto-implementacao.v1
metadata:
  modelo: TEMPLATE
  descricao: Modelo machine-readable da implementacao de uma combinacao ERP x ferramenta
  versao: "1.0"
  etapa_origem: ERP_PARCEIRO_PASSO_06
  data_referencia: null
  observacoes:
    - Nao representa uma integracao real
    - Nao contem codigo executavel, IDs fisicos de cliente ou segredos
    - Nao substitui manifesto de etapa, estado, auditoria ou fontes originais
    - O Passo 06 desenvolve e testa localmente, mas nao executa HML nem homologa a integracao

regras_de_preenchimento:
  - Registrar somente fatos comprovados na execucao real
  - Usar caminhos relativos a raiz do repositorio
  - Preservar decisoes do Passo 05 e registrar divergencias sem corrigi-las silenciosamente
  - Nao persistir valores de credenciais ou configuracoes concretas de cliente
  - Nao declarar comando de validacao que nao exista no projeto
  - Nao declarar PRONTO_PARA_EXECUCAO_HML como SIM sem atender todo o gate

valores_permitidos:
  arquitetura_executavel:
    - DEFINIDA
    - INSUFICIENTE
  responsabilidade:
    - SHARED_CORE
    - ERP_REUSABLE
    - TOOL_REUSABLE
    - COMBINATION_SPECIFIC
  origem_arquivo:
