    - DIVERGENCIA_DE_PROJETO
    - DIVERGENCIA_DE_CONTRATO
    - DIVERGENCIA_DE_ARQUITETURA
  impacto_divergencia:
    - BLOQUEANTE
    - NAO_BLOQUEANTE
  vigencia_implementacao:
    - VIGENTE
    - IMPLEMENTACAO_POTENCIALMENTE_OBSOLETA
    - EVIDENCIA_INSUFICIENTE
  gate:
    ERP_IDENTIFICADO:
      - SIM
      - NAO
    FERRAMENTA_HOMOLOGADA:
      - SIM
      - NAO
    PASSO_05_APTO:
      - SIM
      - NAO
    PROJETO_VIGENTE:
      - SIM
      - NAO
    ARQUITETURA_EXECUTAVEL:
      - DEFINIDA
      - INSUFICIENTE
