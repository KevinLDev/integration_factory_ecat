schema: fabrica.manifesto-integracao-publicada.v1
metadata:
  modelo: TEMPLATE
  descricao: Manifesto de release publicada para uma combinacao ERP x ferramenta
  versao: "1.0"
  etapa_origem: ERP_PARCEIRO_PASSO_09
  data_referencia: null
  observacoes:
    - Nao representa publicacao real por si so
    - Nao contem segredos, dados de cliente ou IDs HML como configuracao reutilizavel
    - A fonte tecnica canonica permanece em erps/<erp-slug>/integracoes/<ferramenta-slug>/

regras_de_preenchimento:
  - Publicar somente baseline homologada integra do Passo 08
  - Usar hashes e modos de hash do Harness vigente
  - Nao declarar INTEGRACAO_PUBLICADA como SIM na execucao produtora
  - Nao usar PARCIAL_JUSTIFICADO em capacidades publicadas
  - Nao persistir segredo real

valores_permitidos:
  status_capacidade:
    - SUPORTADO
    - SUPORTADO_COM_RESTRICAO
    - NAO_SUPORTADO
    - NAO_APLICAVEL
  lifecycle:
    - ATIVA
    - DEPRECATED
    - RETIRADA
  status_publicacao:
    - SIM
    - NAO
  auditoria:
    - AGUARDANDO_INDEPENDENTE
    - APROVADA
    - REPROVADA
    - BLOQUEADA

