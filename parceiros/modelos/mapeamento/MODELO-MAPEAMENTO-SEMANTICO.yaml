schema: fabrica.mapeamento-semantico.v1
metadata:
  modelo: TEMPLATE
  descricao: Modelo reutilizavel do mapeamento semantico de uma combinacao ERP x ferramenta
  versao: "1.0"
  etapa_origem: ERP_PARCEIRO_PASSO_05
  data_referencia: null
  observacoes:
    - Nao representa uma combinacao real
    - Nao contem IDs fisicos, valores de cliente ou segredos
    - Nao altera o contrato homologado da ferramenta

regras_de_preenchimento:
  - Registrar somente itens aplicaveis ao escopo comprovado
  - Campos nao aplicaveis podem permanecer null ou ser removidos no artefato concreto
  - Nunca preencher lacuna com equivalencia, rota, cardinalidade ou operacao inventada
  - Classificacao de mapeamento e estado de evidencia permanecem separados
  - Evidencias devem referenciar fontes efetivamente consultadas
  - O campo status indica somente completude do item e usa valores_permitidos.status_item
  - Estado de evidencia pertence exclusivamente a evidencias.estado ou a referencias de evidencia

