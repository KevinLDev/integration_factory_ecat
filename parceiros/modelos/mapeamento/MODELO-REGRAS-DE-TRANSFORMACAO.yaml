    - Nao contem codigo executavel
    - Cada regra real deve ser implementavel sem decisao semantica adicional
    - Preencher somente o bloco parametros_por_tipo aplicavel a regra concreta
    - Campos nao aplicaveis podem permanecer null ou ser removidos sem inventar valores

